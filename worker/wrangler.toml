name = "sabco-ops-api"
main = "src/index.js"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "sabco-ops"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# Secrets (set with `wrangler secret put <NAME>`):
#   ANTHROPIC_API_KEY  - Claude API key used to read invoice amounts
#   ACCESS_CODE        - shared code users type once per device
