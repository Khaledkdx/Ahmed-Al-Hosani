<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SABCO Field Report</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f0f4f8;min-height:100vh;padding:1.2rem .9rem}
.wrap{max-width:620px;margin:0 auto}
.header{text-align:center;margin-bottom:1.2rem}
.logo{font-size:12px;font-weight:700;letter-spacing:.08em;color:#185FA5;background:#E6F1FB;padding:3px 12px;border-radius:20px;display:inline-block;margin-bottom:6px}
.header h1{font-size:19px;font-weight:600;color:#1a1a2e}
.header p{font-size:12px;color:#888;margin-top:3px}

.upload-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1rem}
.upbtn{padding:10px;border:1px solid #dde3ea;border-radius:10px;background:#fff;font-size:13px;color:#185FA5;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s;font-family:inherit}
.upbtn:hover{background:#E6F1FB}
.upbtn i{font-size:18px}
#img-camera,#img-gallery{position:absolute;opacity:0;width:0;height:0}

.upload-zone{border:2px dashed #b0c4de;border-radius:12px;background:#fff;min-height:120px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;margin-bottom:1rem;position:relative;overflow:hidden;cursor:pointer}
.upload-zone:hover{background:#f0f7ff;border-color:#378ADD}
.upload-hint{display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.upload-hint i{font-size:30px;color:#378ADD}
.upload-hint span{font-size:13px;color:#666}
.upload-hint small{font-size:11px;color:#aaa}
#preview-img{width:100%;max-height:260px;object-fit:contain;display:none}
.change-btn{position:absolute;bottom:8px;right:8px;background:rgba(24,95,165,0.85);color:#fff;border:none;border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;display:none}

.section{background:#fff;border:1px solid #e8edf2;border-radius:12px;padding:.9rem 1.1rem;margin-bottom:.9rem}
.section-title{font-size:11px;font-weight:700;color:#185FA5;text-transform:uppercase;letter-spacing:.07em;margin-bottom:.65rem;display:flex;align-items:center;gap:5px}
.section-title i{font-size:14px}
.options-grid{display:flex;flex-wrap:wrap;gap:6px}
.opt{display:flex;align-items:center;gap:5px;padding:6px 10px;border:1px solid #dde3ea;border-radius:8px;cursor:pointer;font-size:12.5px;color:#333;background:#fafbfc;transition:all .15s;user-select:none;font-family:inherit;text-align:left}
.opt:hover{background:#f0f7ff;border-color:#378ADD}
.opt.selected{background:#E6F1FB;border-color:#378ADD;color:#0C447C}
.opt.selected .chk{background:#378ADD;border-color:#378ADD}
.chk{width:13px;height:13px;border:1.5px solid #b0bec8;border-radius:3px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chk i{font-size:9px;color:#fff;display:none}
.opt.selected .chk i{display:flex}
.proj-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.other-row{display:flex;align-items:center;gap:7px;margin-top:7px}
.other-row label{font-size:12px;color:#999;white-space:nowrap}
.other-row input{flex:1;min-width:0;padding:6px 9px;border:1px solid #dde3ea;border-radius:7px;font-size:12.5px;color:#333;background:#fafbfc}
.other-row input:focus{outline:none;border-color:#378ADD}
.empty-note{font-size:12.5px;color:#B4610F}

.fixed-badge{background:#E6F1FB;border:1px solid #b8d4f0;border-radius:10px;padding:10px 14px;font-size:13px;color:#0C447C;display:flex;align-items:center;gap:8px;margin-bottom:.9rem}
.fixed-badge i{font-size:16px;flex-shrink:0}

.amount-row{display:flex;align-items:center;gap:8px}
.amount-row input{flex:1;min-width:0;padding:10px 12px;border:1px solid #dde3ea;border-radius:8px;font-size:17px;font-weight:600;color:#1a1a2e;background:#fafbfc}
.amount-row input:focus{outline:none;border-color:#378ADD}
.amount-row input.need{border-color:#D9822B;background:#FFF6EA}
.amount-row .cur{font-size:13px;font-weight:600;color:#888}
.amount-status{font-size:12px;margin-top:6px;color:#888;min-height:16px;display:flex;align-items:center;gap:5px}
.amount-status.ok{color:#0F6E56}
.amount-status.warn{color:#B4610F}
.spin{width:12px;height:12px;border:2px solid #cfd9e3;border-top-color:#378ADD;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

.pending-bar{display:none;align-items:center;gap:8px;background:#FFF6EA;border:1px solid #F0C98F;color:#7A4A0C;border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:.9rem}
.pending-bar button{margin-left:auto;border:none;background:#B4610F;color:#fff;border-radius:7px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}

.action-row{display:none;grid-template-columns:1fr 1fr;gap:10px;margin-top:.9rem;margin-bottom:.5rem}
.wa-btn{padding:13px;background:#25D366;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:background .2s;font-family:inherit}
.wa-btn:hover{background:#1aab52}
.dl-btn{padding:13px;background:#0F6E56;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;transition:background .2s}
.dl-btn:hover{background:#085041}
.saved-note{font-size:12px;color:#0F6E56;text-align:center;min-height:16px;margin-bottom:.5rem}

.sum{display:flex;gap:12px}
.sum img{width:84px;height:84px;object-fit:cover;border-radius:8px;flex-shrink:0;background:#eef2f6}
.sum dl{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;font-size:13px;min-width:0}
.sum dt{color:#999;font-weight:600}
.sum dd{color:#1a1a2e;overflow-wrap:anywhere}
.fixed-badge .who-change{margin-left:auto;border:1px solid #b8d4f0;background:#fff;color:#185FA5;border-radius:8px;padding:4px 9px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.pick-list{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.pick-list button{padding:13px 14px;border:1px solid #dde3ea;border-radius:10px;background:#fafbfc;font-size:15px;font-weight:600;color:#1a1a2e;text-align:left;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:8px}
.pick-list button:hover{background:#E6F1FB;border-color:#378ADD}
.load-err{background:#fbeaea;border:1px solid #f0b8b8;color:#8a1f1f;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:.9rem;display:none}
.sum .big{font-size:16px;font-weight:700;color:#0F6E56}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="logo">SABCO</div>
    <h1>Field Report</h1>
    <p>ارفع صورة، اختر البيانات، شارك على واتساب</p>
    <div class="userbar" id="userbar"></div>
  </div>

  <div class="pending-bar" id="pending-bar"><i class="ti ti-cloud-upload"></i><span id="pending-text"></span><button type="button" id="pending-retry">ارفع دلوقتي</button></div>

  <div class="upload-btns">
    <button class="upbtn" type="button" onclick="document.getElementById('img-camera').click()"><i class="ti ti-camera"></i> Open Camera</button>
    <button class="upbtn" type="button" onclick="document.getElementById('img-gallery').click()"><i class="ti ti-photo"></i> From Gallery</button>
  </div>
  <input type="file" id="img-camera" accept="image/*" capture="environment">
  <input type="file" id="img-gallery" accept="image/*">

  <div class="upload-zone" id="upload-zone" onclick="document.getElementById('img-gallery').click()">
    <div class="upload-hint" id="upload-hint">
      <i class="ti ti-photo-up"></i>
      <span>الصورة ستظهر هنا</span>
      <small>اضغط لاختيار من الجهاز</small>
    </div>
    <img id="preview-img" alt="Invoice photo preview">
    <button class="change-btn" id="change-btn" type="button" onclick="event.stopPropagation();document.getElementById('img-gallery').click()"><i class="ti ti-refresh"></i> تغيير</button>
  </div>

  <div class="load-err" id="load-err" role="alert"></div>
  <div class="fixed-badge"><i class="ti ti-user-check"></i> <span>👷 <b id="eng-name">…</b> &nbsp;|&nbsp; 💳 <b>Cash</b></span>
    <button type="button" class="who-change" id="who-change">مش أنا؟</button></div>

  <div class="section">
    <div class="section-title"><i class="ti ti-cash"></i> Amount</div>
    <div class="amount-row">
      <input type="number" id="amount" inputmode="decimal" min="0" step="0.01" placeholder="0.00" aria-label="Amount in AED">
      <span class="cur">AED</span>
    </div>
    <div class="amount-status" id="amount-status">يُقرأ تلقائياً من صورة الفاتورة</div>
  </div>

  <div class="section">
    <div class="section-title"><i class="ti ti-building"></i> Project</div>
    <div class="options-grid" id="project-opts"></div>
  </div>

  <div class="section">
    <div class="section-title"><i class="ti ti-layers-subtract"></i> Stage</div>
    <div class="options-grid" id="stage-opts"></div>
    <div class="other-row"><label for="stage-other">Other:</label><input type="text" id="stage-other" placeholder="..."></div>
  </div>

  <div class="section">
    <div class="section-title"><i class="ti ti-category"></i> Type</div>
    <div class="options-grid" id="type-opts"></div>
    <div class="other-row"><label for="type-other">Other:</label><input type="text" id="type-other" placeholder="..."></div>
  </div>

  <div class="action-row" id="action-row">
    <button class="wa-btn" id="wa-btn" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="white" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      Share & Save
    </button>
    <a class="dl-btn" id="dl-link" download="sabco_report.jpg">
      <i class="ti ti-download"></i> Download
    </a>
  </div>
  <div class="saved-note" id="saved-note" role="status"></div>
</div>

<script src="api.js"></script>
<script>
const $ = id => document.getElementById(id);
let me = null;
let imgFile = null, imgObjectUrl = null;
let opId = null;            // one operation per chosen image (re-sharing updates it)
let amountSource = 'manual';
let extractSeq = 0;
const sel = { project: null, stage: [], type: [] };

function optHtml(group, val, label, extra = ''){
  return `<button type="button" class="opt" data-group="${group}" data-val="${esc(val)}">${extra}<span class="chk"><i class="ti ti-check"></i></span>${esc(label)}</button>`;
}

function renderOptions(){
  const projects = me.projects.filter(p => p.active);
  $('project-opts').innerHTML = projects.length
    ? projects.map(p => optHtml('project', p.id, p.name, `<span class="proj-dot" style="background:${esc(p.color)}"></span>`)).join('')
    : '<div class="empty-note">مفيش مشاريع مسندة لحسابك. كلّم الأدمن يسند لك مشروع.</div>';
  $('stage-opts').innerHTML = me.stages.filter(s => s.active).map(s => optHtml('stage', s.name, s.name)).join('');
  $('type-opts').innerHTML = TYPES.map(([v, l]) => optHtml('type', v, l)).join('');
  if(projects.length === 1) selectProject(String(projects[0].id));
}

function selectProject(id){
  sel.project = id;
  document.querySelectorAll('.opt[data-group="project"]').forEach(o => o.classList.toggle('selected', o.dataset.val === id));
}

document.addEventListener('click', e => {
  const el = e.target.closest('.opt'); if(!el) return;
  const g = el.dataset.group, v = el.dataset.val;
  if(g === 'project'){ selectProject(sel.project === v ? null : v); return; }
  el.classList.toggle('selected');
  if(el.classList.contains('selected')) sel[g].push(v); else sel[g] = sel[g].filter(x => x !== v);
});

function getVals(g, id){
  const o = $(id).value.trim();
  return [...sel[g], ...(o ? ['Other: ' + o] : [])];
}
const projectObj = () => me.projects.find(p => String(p.id) === sel.project);

// ---------- photo + AI amount ----------
function handleFile(file){
  if(!file) return;
  imgFile = file;
  if(imgObjectUrl) URL.revokeObjectURL(imgObjectUrl);
  imgObjectUrl = URL.createObjectURL(file);
  $('upload-hint').style.display = 'none';
  $('preview-img').src = imgObjectUrl; $('preview-img').style.display = 'block';
  $('change-btn').style.display = 'block';
  $('dl-link').href = imgObjectUrl;
  $('dl-link').download = file.name || 'sabco_report.jpg';
  $('action-row').style.display = 'grid';
  $('saved-note').textContent = '';
  opId = crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2);
  readAmount(file);
}
$('img-camera').addEventListener('change', function(){ handleFile(this.files[0]); this.value = ''; });
$('img-gallery').addEventListener('change', function(){ handleFile(this.files[0]); this.value = ''; });

const amountEl = $('amount');
function setStatus(cls, html){ $('amount-status').className = 'amount-status' + (cls ? ' ' + cls : ''); $('amount-status').innerHTML = html; }
function askAmount(msg){ amountEl.classList.add('need'); setStatus('warn', '<i class="ti ti-alert-triangle"></i> ' + esc(msg)); }
amountEl.addEventListener('input', () => { amountSource = 'manual'; amountEl.classList.remove('need'); if(amountEl.value) setStatus('', ''); });

async function readAmount(file){
  const seq = ++extractSeq;
  amountEl.value = ''; amountSource = 'manual'; amountEl.classList.remove('need');
  setStatus('', '<span class="spin"></span> جاري قراءة المبلغ من الفاتورة…');
  let amount = null;
  try{
    const dataUrl = await resizeImage(file, 1568, 0.85);
    if(dataUrl) amount = (await Api.publicExtract(me.user.id, dataUrl.split(',')[1])).amount;
  } catch(e){ console.log('extract error', e); }
  if(seq !== extractSeq || amountEl.value) return; // newer photo, or the user already typed
  if(amount != null){
    amountEl.value = amount; amountSource = 'ai';
    setStatus('ok', '<i class="ti ti-sparkles"></i> المبلغ اتقرأ من الفاتورة. راجعه وعدّله لو غلط');
  } else {
    askAmount('مقدرتش أقرأ المبلغ. اكتب المبلغ من فضلك');
    amountEl.focus();
  }
}

// ---------- validate, confirm, share + save ----------
function validate(){
  if(!(parseFloat(amountEl.value) > 0)){
    askAmount('اكتب المبلغ أولاً'); amountEl.focus();
    amountEl.scrollIntoView({behavior:'smooth', block:'center'});
    return false;
  }
  if(!projectObj()){ toast('اختر المشروع أولاً / Select a project'); return false; }
  return true;
}

function buildText(){
  const stage = getVals('stage', 'stage-other'), type = getVals('type', 'type-other');
  const now = new Date();
  const dateStr = now.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'}) + ' ' + now.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
  return (
    '🏗 *SABCO Field Report*\n' +
    '━━━━━━━━━━━━━━━\n' +
    '👷 *Name:* ' + me.user.name + '\n' +
    '📅 *Date:* ' + dateStr + '\n' +
    '━━━━━━━━━━━━━━━\n' +
    '📌 *Project:* ' + projectObj().name + '\n' +
    '🏗 *Stage:* ' + (stage.length ? stage.join(', ') : '—') + '\n' +
    '🔖 *Type:* ' + (type.length ? type.join(', ') : '—') + '\n' +
    '💰 *Amount:* ' + fmtAmount(parseFloat(amountEl.value)) + ' AED\n' +
    '💳 *Payment:* Cash\n' +
    '━━━━━━━━━━━━━━━'
  );
}

// Opens the share sheet. Must run synchronously inside the confirm click.
function openShare(text){
  if(navigator.share && navigator.canShare){
    try{
      if(navigator.canShare({files:[imgFile]})){
        navigator.share({files:[imgFile], title:'SABCO Field Report', text}).catch(e => console.log('share closed', e));
        return;
      }
    } catch(e){ console.log('share error', e); }
  }
  window.open('https://wa.me/?text=' + encodeURIComponent(text + '\n\n📎 _Please attach the image manually_'), '_blank');
}

async function saveOp(op, file){
  op.thumb = await resizeImage(file, 1000, 0.7);
  try{
    await Api.publicSaveOp(op);
    $('saved-note').textContent = '✓ اتحفظت في الداشبورد';
    toast('✓ Saved to dashboard');
  } catch(e){
    if(e.status === 0 || e.status >= 500){
      Pending.add(op);
      updatePending();
      $('saved-note').textContent = 'هتترفع للداشبورد أول ما النت يرجع';
      toast('مفيش نت: العملية محفوظة على الموبايل وهتترفع تلقائياً');
    } else if(e.status !== 401){
      $('saved-note').textContent = '';
      toast('⚠ ما اتحفظتش: ' + e.message, 4500);
    }
  }
}

$('wa-btn').addEventListener('click', async () => {
  if(!imgFile || !validate()) return;
  const now = new Date();
  const p = projectObj();
  const stage = getVals('stage', 'stage-other'), type = getVals('type', 'type-other');
  const amount = parseFloat(amountEl.value);
  const op = {
    id: opId, engineer_id: me.user.id, created_at: now.toISOString(), date: localDateKey(now), project_id: p.id,
    stage, type, amount, amount_source: amountSource,
  };
  const text = buildText();
  const file = imgFile;
  await confirmDialog({
    title: 'تأكيد الإرسال والحفظ',
    html: `<div class="sum"><img src="${imgObjectUrl}" alt="">
      <dl><dt>Project</dt><dd>${esc(p.name)}</dd><dt>Stage</dt><dd>${esc(stage.join(', ') || '—')}</dd>
      <dt>Type</dt><dd>${esc(type.join(', ') || '—')}</dd><dt>Amount</dt><dd class="big">${fmtAmount(amount)} AED</dd></dl></div>
      <p style="margin-top:10px;font-size:12.5px;color:#666">هيتفتح واتساب للإرسال، والعملية هتتحفظ في الداشبورد.</p>`,
    ok: 'تأكيد وإرسال', tone: 'wa',
    onConfirm: () => { openShare(text); saveOp(op, file); },
  });
});

// ---------- pending uploads ----------
function updatePending(){
  const n = Pending.count();
  $('pending-bar').style.display = n ? 'flex' : 'none';
  $('pending-text').textContent = n + (n === 1 ? ' عملية مستنية الرفع للداشبورد' : ' عمليات مستنية الرفع للداشبورد');
}
async function flushPending(){
  if(!Pending.count()) return;
  const sent = await Pending.flush();
  updatePending();
  if(sent) toast('✓ اترفع ' + sent + ' للداشبورد');
}
$('pending-retry').addEventListener('click', flushPending);
window.addEventListener('online', flushPending);

// ---------- start: no sign-in; the engineer picks their name once ----------
const ENG_KEY = 'sabco_engineer_id';
let config = null;
const savedEngineer = () => { try { return Number(localStorage.getItem(ENG_KEY)) || null; } catch(e) { return null; } };
const saveEngineer = id => { try { localStorage.setItem(ENG_KEY, String(id)); } catch(e) {} };

function applyEngineer(eng){
  me = {
    user: { id: eng.id, name: eng.name },
    projects: config.projects.filter(p => eng.project_ids.includes(p.id)).map(p => ({ ...p, active: true })),
    stages: config.stages.map((name, i) => ({ id: i, name, active: true })),
  };
  sel.project = null;
  $('eng-name').textContent = eng.name;
  renderOptions();
}

function pickEngineer(){
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'ui-modal';
    wrap.innerHTML = `<div class="ui-box" role="dialog" aria-modal="true" aria-labelledby="pick-title">
      <h3 id="pick-title">اختار اسمك</h3>
      <div class="ui-body">هتختاره مرة واحدة، والموبايل هيفتكره.</div>
      <div class="pick-list">${config.engineers.length
        ? config.engineers.map(e => `<button type="button" data-id="${e.id}">👷 ${esc(e.name)}</button>`).join('')
        : '<div class="empty-note">مفيش مهندسين لسه. الأدمن يضيفهم من صفحة الإدارة.</div>'}</div></div>`;
    document.body.appendChild(wrap);
    wrap.addEventListener('click', e => {
      const b = e.target.closest('button[data-id]'); if(!b) return;
      const eng = config.engineers.find(x => x.id === Number(b.dataset.id));
      saveEngineer(eng.id); wrap.remove(); resolve(eng);
    });
  });
}

$('who-change').addEventListener('click', async () => { applyEngineer(await pickEngineer()); });

(async () => {
  $('userbar').innerHTML = '<a class="pill-link" href="dashboard.html"><i class="ti ti-calendar-stats"></i> Dashboard</a>';
  try { config = await Api.publicConfig(); }
  catch(e){
    $('load-err').style.display = 'block';
    $('load-err').textContent = 'مقدرتش أحمّل البيانات: ' + e.message + '. اتأكد من النت وافتح الصفحة تاني.';
    return;
  }
  const eng = config.engineers.find(x => x.id === savedEngineer()) || await pickEngineer();
  applyEngineer(eng);
  updatePending();
  flushPending();
})();
</script>
</body>
</html>
